[project]
name = "maple-boss-bot"
version = "0.1.0"
description = "메이플스토리 보스 파티 일정과 결정석 수익 정산을 돕는 디스코드 봇"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
# 로컬에 alembic/ 디렉터리가 있어서 라이브러리를 1st-party로 오인하는 걸 막는다.
known-first-party = ["bot"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# 슬래시 커맨드 파라미터가 한글이라 함수 인자 이름이 길어지는 건 감수한다.
"bot/cogs/*.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]
# 보스 사진 URL은 해시가 길어 줄바꿈이 불가능하다.
"bot/domain/boss_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
